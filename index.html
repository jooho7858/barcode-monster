<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바코드 몬스터 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- 바코드 판독기: ZXing-C++ 웹어셈블리판. 판독 엔진(.wasm)은 처음 쓸 때 jsDelivr에서 받아옴 -->
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.js"></script>
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --text: #222; --sub: #777; --line: #e4ded4; --btn: #2b2b2b; --btn-text: #fff; --focus: #3b7ddd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17171a; --card: #232328; --text: #eee; --sub: #999; --line: #34343a; --btn: #eee; --btn-text: #111; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #17171a; --card: #232328; --text: #eee; --sub: #999; --line: #34343a; --btn: #eee; --btn-text: #111; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--sub); font-size: 14px; margin: 0 0 16px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px; background: var(--btn); color: var(--btn-text); cursor: pointer; width: 100%; font-weight: 600; }
  #photo { position: absolute; opacity: 0; width: 1px; height: 1px; }
  label.btn { display: block; text-align: center; border-radius: 12px; padding: 12px; cursor: pointer; font-weight: 600; margin-top: 8px; background: transparent; color: var(--text); border: 1px solid var(--line); }
  #photo:focus-visible + label.btn { outline: 3px solid var(--focus); }
  #video { display: block; width: 100%; margin-top: 12px; border-radius: 12px; background: #000; }
  #msg { min-height: 20px; color: #d33; font-size: 14px; margin: 8px 0; }
  #result { text-align: center; background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 18px; margin: 12px 0; }
  .portrait { width: 180px; height: 180px; margin: 0 auto; border-radius: 50%; overflow: hidden; }
  .portrait img { width: 84%; height: 84%; margin: 8%; display: block; } /* 꼬리·귀가 동그라미 밖으로 잘리지 않게 */
  #result .name { font-size: 22px; font-weight: 700; margin-top: 10px; }
  .tag { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 99px; color: #fff; font-size: 13px; }
  #result .note { font-weight: 700; margin-bottom: 8px; }
  .stats { display: flex; justify-content: center; gap: 16px; margin-top: 10px; font-size: 14px; }
  .stats b { display: block; font-size: 18px; }
  .info { margin-top: 14px; text-align: left; font-size: 14px; display: grid; gap: 8px; }
  .info label { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; color: var(--sub); }
  .info input { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
  .info .line { display: grid; grid-template-columns: 64px 1fr; gap: 8px; color: var(--sub); }
  .info .line span:last-child { color: var(--text); }
  h2 { font-size: 17px; margin: 24px 0 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
  #count { font-size: 14px; font-weight: 500; color: var(--sub); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; cursor: pointer; font: inherit; color: var(--text); }
  .cell .portrait { width: 60px; height: 60px; }
  .cell small { font-size: 11px; margin-top: 4px; text-align: center; word-break: keep-all; }
  .empty { color: var(--sub); font-size: 14px; grid-column: 1 / -1; }
</style>
<main>
  <h1>바코드 몬스터 도감</h1>
  <p class="sub">상품 바코드를 찍으면 몬스터가 나타나요. 몬스터는 밤 12시마다 바뀌고, 사람마다 달라요. 같은 상품은 하루에 한 번만 잡을 수 있어요.</p>

  <button id="scanBtn">📷 바코드 스캔</button>
  <video id="video" playsinline muted hidden></video>
  <!-- 예비: 실시간 카메라가 막힌 곳에서는 사진으로 읽기 -->
  <input type="file" id="photo" accept="image/*" capture="environment">
  <label for="photo" class="btn" id="photoLabel">🖼 사진으로 읽기</label>
  <div id="msg"></div>

  <div id="result" hidden></div>

  <h2><span>내 도감</span><span id="count"></span></h2>
  <div class="grid" id="dex"></div>
</main>

<script>
// ================= 규칙 =================
const TIERS = [
  { name: '일반', p: 55,  c1: '#f3f4f6', c2: '#b4bbc4', tag: '#7d8793' },
  { name: '고급', p: 27,  c1: '#e6f7e9', c2: '#6cc283', tag: '#3f9a57' },
  { name: '희귀', p: 12,  c1: '#e3eeff', c2: '#6a9fee', tag: '#3b7ddd' },
  { name: '영웅', p: 4.9, c1: '#f2e8ff', c2: '#a877ea', tag: '#8a4fe0' },
  { name: '전설', p: 1,   c1: '#fff8cc', c2: '#eab800', tag: '#c99700' },
  { name: '신화', p: 0.1, c1: '#ffe0e0', c2: '#e84545', tag: '#e03131' },
];
const COLORS = [ // 몸 색. null = 시트 원래 보라색
  { name: '보라', hue: null }, { name: '분홍', hue: 340 }, { name: '빨강', hue: 5 }, { name: '주황', hue: 28 },
  { name: '노랑', hue: 50 }, { name: '연두', hue: 95 }, { name: '초록', hue: 140 }, { name: '하늘', hue: 195 }, { name: '파랑', hue: 220 },
];
const PART_KEYS = ['head', 'body', 'eyes', 'mouth', 'tail', 'ears']; // 시트 줄 순서와 같음
const PARTS_URL = 'parts.webp';

// 이름: 표기는 한글, 모습이 같으면 이름도 같음
const SYL = ['뭉','뽀','꾸','몽','삐','토','루','미','쿠','포','치','나','보','링','퐁','도','키','파','무','니','젤','렌','샤','쥬','엘','티','벨','코','모','타','쵸','피','로','라','소','유','하','비','츄','네'];
const END = ['이','몽','뽀','룽','치','삐','롱','토','링','콩','냥','곰','스','아','엘','나','쿠','핑','뇽','미'];

// 같은 글자 → 항상 같은 숫자 (FNV-1a 해시)
function hash(str) {
  let h = 2166136261;
  for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// 해시를 씨앗으로 쓰는 난수 생성기(mulberry32)
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const designKey = m => PART_KEYS.map(k => m.parts[k]).join('') + '-' + m.color;
function nameFor(m) {
  const rand = rng(hash('name|' + designKey(m)));
  const pick = a => a[Math.floor(rand() * a.length)];
  let s = pick(SYL);
  for (let i = Math.floor(rand() * 3); i > 0; i--) s += pick(SYL);
  return s + pick(END);
}
function rollTier(rand) {
  let r = rand() * 100;
  for (let i = 0; i < TIERS.length; i++) { r -= TIERS[i].p; if (r < 0) return i; }
  return 0;
}
// 바코드 + 날짜 + 사람 → 몬스터
function makeMonster(code, day, player) {
  const rand = rng(hash(`${code}|${day}|${player}`));
  const tier = rollTier(rand);
  const parts = {};
  for (const k of PART_KEYS) parts[k] = Math.floor(rand() * 6);
  const color = Math.floor(rand() * COLORS.length);
  const stat = () => Math.min(99, 10 + Math.floor(rand() * 50) + tier * 8);
  const m = { code, day, tier, parts, color, hp: stat(), atk: stat(), def: stat() };
  m.name = nameFor(m);
  return m;
}

// 상품 바코드(EAN-8, UPC-A, EAN-13 등)는 숫자 8~14자리
function cleanCode(raw) {
  const code = String(raw).replace(/\D/g, '');
  return code.length >= 8 && code.length <= 14 ? code : null;
}
const pad = n => String(n).padStart(2, '0');
const today = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // 밤 12시 기준

// ================= 저장 (이 폰의 브라우저에만) =================
const STORE_KEY = 'barcode-dex-v3', PLAYER_KEY = 'barcode-player';
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* 저장 불가 환경: 이번 화면에서만 유지 */ } }
let player = load(PLAYER_KEY, null);
if (!player) { player = Math.random().toString(36).slice(2) + Date.now().toString(36); save(PLAYER_KEY, player); }
let catches = load(STORE_KEY, []); // 잡은 몬스터, 최신순. 잡은 순간 모습 그대로 저장

// ================= 부품 시트 자르기 =================
let cut = null; // cut[줄][칸] = 잘라낸 부품 canvas
const ctx2d = cv => cv.getContext('2d', { willReadFrequently: true });
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dd = mx - mn;
  if (!dd) return [0, 0, l];
  const s = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
  const h = mx === r ? ((g - b) / dd + (g < b ? 6 : 0)) : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
  return [h * 60, s, l];
}
function hsl2rgb(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0), f(8), f(4)].map(v => Math.round(v * 255));
}
// 시트 배경은 투명. 반투명한 진분홍·빨강 번짐은 배경으로 침
function isPart(d, p) {
  const a = d[p * 4 + 3];
  if (a < 140) return false;
  if (a > 245) return true;
  const [h, s] = rgb2hsl(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]);
  return !((h > 285 || h < 15) && s > 0.75);
}
// 값 배열에서 내용 있는 구간 찾기. want개보다 많으면 가장 좁은 틈부터 합침
function groups(counts, minCount, want, any = false) {
  let g = [], start = -1;
  counts.forEach((v, i) => {
    if (v >= minCount && start < 0) start = i;
    if ((v < minCount || i === counts.length - 1) && start >= 0) { g.push([start, v < minCount ? i - 1 : i]); start = -1; }
  });
  g = g.filter(([a, b]) => b - a >= 2);
  if (any) return g;
  while (g.length > want) {
    let k = 0;
    for (let i = 1; i < g.length - 1; i++) if (g[i + 1][0] - g[i][1] < g[k + 1][0] - g[k][1]) k = i;
    g.splice(k, 2, [g[k][0], g[k + 1][1]]);
  }
  if (g.length !== want) throw new Error(`부품 줄 ${want}개를 기대했는데 ${g.length}개를 찾음`);
  return g;
}
function cleanCell(id) {
  const { width: w, height: h, data: d } = id, n = w * h;
  const bg = new Uint8Array(n);
  for (let p = 0; p < n; p++) bg[p] = isPart(d, p) ? 0 : 1;
  const seen = new Uint8Array(n); // 80픽셀 미만 얼룩 지우기
  for (let s = 0; s < n; s++) {
    if (bg[s] || seen[s]) continue;
    const comp = [s]; seen[s] = 1;
    for (let k = 0; k < comp.length; k++) {
      const p = comp[k], x = p % w;
      for (const q of [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, p - w, p + w]) if (q >= 0 && q < n && !bg[q] && !seen[q]) { seen[q] = 1; comp.push(q); }
    }
    if (comp.length < 80) for (const p of comp) bg[p] = 1;
  }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let p = 0; p < n; p++) {
    if (bg[p]) { d[p * 4 + 3] = 0; continue; }
    d[p * 4 + 3] = 255;
    const x = p % w, y = (p - x) / w;
    if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').putImageData(id, 0, 0);
  const part = document.createElement('canvas'); part.width = maxX - minX + 1; part.height = maxY - minY + 1;
  part.getContext('2d').drawImage(tmp, -minX, -minY);
  return part;
}
function cutSheet(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const full = document.createElement('canvas'); full.width = W; full.height = H;
  const fx = ctx2d(full); fx.drawImage(img, 0, 0);
  const d = fx.getImageData(0, 0, W, H).data;
  const ink = new Uint8Array(W * H);
  for (let p = 0; p < W * H; p++) ink[p] = isPart(d, p) ? 1 : 0;
  const rowCount = Array.from({ length: H }, (_, y) => { let s = 0; for (let x = 0; x < W; x++) s += ink[y * W + x]; return s; });
  const out = [];
  for (const [y0, y1] of groups(rowCount, 4, 6)) {
    const colCount = Array.from({ length: W }, (_, x) => { let s = 0; for (let y = y0; y <= y1; y++) s += ink[y * W + x]; return s; });
    const cols = Array.from({ length: 6 }, () => [Infinity, -1]); // 가로 6칸: 덩어리 가운데가 속한 칸으로 묶음
    for (const [a, b] of groups(colCount, 2, 0, true)) {
      const k = Math.min(5, Math.floor((a + b) / 2 / (W / 6)));
      cols[k] = [Math.min(cols[k][0], a), Math.max(cols[k][1], b)];
    }
    if (cols.some(c => c[1] < 0)) throw new Error('부품 시트에 빈 칸이 있음');
    out.push(cols.map(([x0, x1]) => {
      const m = 6, ax = Math.max(0, x0 - m), ay = Math.max(0, y0 - m);
      return cleanCell(fx.getImageData(ax, ay, Math.min(W, x1 + m + 1) - ax, Math.min(H, y1 + m + 1) - ay));
    }));
  }
  return out;
}

// ================= 색 바꾸기: 보라 몸 부분만 =================
const tintCache = new Map();
function tinted(r, c, hue) {
  if (hue === null) return cut[r][c];
  const k = `${r},${c},${hue}`;
  if (tintCache.has(k)) return tintCache.get(k);
  const src = cut[r][c], cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
  const x = ctx2d(cv); x.drawImage(src, 0, 0);
  const id = x.getImageData(0, 0, cv.width, cv.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const [h, s, l] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
    if (h >= 235 && h <= 320 && s > 0.15 && l > 0.38) { const [nr, ng, nb] = hsl2rgb(hue, s, l); d[i] = nr; d[i + 1] = ng; d[i + 2] = nb; }
  }
  x.putImageData(id, 0, 0); tintCache.set(k, cv); return cv;
}

// ================= 귀 붙이기 =================
const alphaOf = cv => ctx2d(cv).getImageData(0, 0, cv.width, cv.height).data;
function cropX(cv, x0, x1) {
  const a = alphaOf(cv); let y0 = cv.height, y1 = -1;
  for (let y = 0; y < cv.height; y++) for (let x = x0; x <= x1; x++) if (a[(y * cv.width + x) * 4 + 3]) { if (y < y0) y0 = y; y1 = y; break; }
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(cv, -x0, -y0); return o;
}
function splitPair(cv) { // 한 쌍짜리 귀를 왼쪽·오른쪽으로. 외뿔이면 null
  const a = alphaOf(cv), W = cv.width, H = cv.height;
  const empty = x => { for (let y = 0; y < H; y++) if (a[(y * W + x) * 4 + 3]) return false; return true; };
  let best = null, start = -1;
  for (let x = Math.floor(W * 0.25); x < W * 0.75; x++) {
    if (empty(x)) { if (start < 0) start = x; } else if (start >= 0) { if (!best || x - start > best[1] - best[0]) best = [start, x - 1]; start = -1; }
  }
  return best ? [cropX(cv, 0, best[0] - 1), cropX(cv, best[1] + 1, W - 1)] : null;
}
function earSpots(head) { // 얼굴 폭이 최대 폭의 60%가 되는 높이의 양 끝
  const a = alphaOf(head), W = head.width, H = head.height, rows = [];
  for (let y = 0; y < H; y++) { let l = -1, r = -1; for (let x = 0; x < W; x++) if (a[(y * W + x) * 4 + 3]) { if (l < 0) l = x; r = x; } rows.push([l, r]); }
  const maxW = Math.max(...rows.map(([l, r]) => r - l));
  const y = rows.findIndex(([l, r]) => l >= 0 && r - l >= maxW * 0.6);
  return { y, l: rows[y][0], r: rows[y][1], top: rows.findIndex(([l]) => l >= 0) };
}

// ================= 몬스터 그리기: 꼬리·귀 → 몸통·얼굴 → 눈·입 =================
const FACE_Y = [[0.5, 0.72], [0.5, 0.72], [0.6, 0.8], [0.5, 0.72], [0.6, 0.8], [0.64, 0.82]]; // 얼굴별 눈·입 높이
function drawMonster(canvas, m) {
  const g = canvas.getContext('2d'), S = canvas.width, P = m.parts;
  g.clearRect(0, 0, S, S);
  const hue = COLORS[m.color].hue;
  const body = tinted(1, P.body, hue), head = tinted(0, P.head, hue), tail = tinted(4, P.tail, hue);
  const ears = tinted(5, P.ears, hue), eyes = cut[2][P.eyes], mouth = cut[3][P.mouth];
  const bx = S / 2 - body.width / 2, by = S - 16 - body.height;
  const hx = S / 2 - head.width / 2, hy = by + body.height * 0.22 - head.height;
  const [ey, my] = FACE_Y[P.head];
  g.drawImage(tail, S / 2 + body.width * 0.16, by + body.height * 0.86 - tail.height);
  const spot = earSpots(cut[0][P.head]), pair = splitPair(ears);
  if (pair) {
    const [L, R] = pair;
    g.drawImage(L, hx + spot.l - L.width * 0.3, hy + spot.y - L.height * 0.65);
    g.drawImage(R, hx + spot.r - R.width * 0.7, hy + spot.y - R.height * 0.65);
  } else g.drawImage(ears, S / 2 - ears.width / 2, hy + spot.top - ears.height * 0.8);
  g.drawImage(body, bx, by);
  g.drawImage(head, hx, hy);
  g.drawImage(eyes, S / 2 - eyes.width / 2, hy + head.height * ey - eyes.height / 2);
  g.drawImage(mouth, S / 2 - mouth.width / 2, hy + head.height * my - mouth.height / 2);
}
const imgCache = new Map(); // 같은 모습은 한 번만 그림
function monsterImg(m) {
  const k = designKey(m);
  if (!imgCache.has(k)) { const cv = document.createElement('canvas'); cv.width = cv.height = 460; drawMonster(cv, m); imgCache.set(k, cv.toDataURL('image/png')); }
  return imgCache.get(k);
}

// 부품 시트 불러오기
const partsReady = new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => { try { cut = cutSheet(img); resolve(); } catch (e) { reject(e); } };
  img.onerror = () => reject(new Error('부품 그림을 불러오지 못했어요.'));
  img.src = PARTS_URL;
});

// ================= 화면 =================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const portrait = m => `<div class="portrait" style="background:radial-gradient(circle at 50% 40%, ${TIERS[m.tier].c1}, ${TIERS[m.tier].c2})"><img src="${monsterImg(m)}" alt=""></div>`;
const when = iso => new Date(iso).toLocaleString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });

function renderDex() {
  const by = t => catches.filter(c => c.tier === t).length;
  const rare = TIERS.map((t, i) => i >= 2 && by(i) ? `${t.name} ${by(i)}` : '').filter(Boolean).join(' · ');
  $('count').textContent = `${catches.length}마리${rare ? ` (${rare})` : ''}`;
  $('dex').innerHTML = catches.length
    ? catches.map((m, i) => `<button class="cell" style="border-color:${TIERS[m.tier].tag}" data-i="${i}" aria-label="${esc(m.name)} 보기">${portrait(m)}<small>${esc(m.name)}</small></button>`).join('')
    : '<p class="empty">아직 몬스터가 없어요. 바코드를 찍어 보세요!</p>';
}

let shown = null; // 지금 카드에 보이는 몬스터
function showCard(m, note) {
  shown = m;
  const T = TIERS[m.tier], box = $('result');
  box.style.borderColor = T.tag;
  box.hidden = false;
  box.innerHTML = `
    ${note ? `<div class="note">${note}</div>` : ''}
    ${portrait(m)}
    <div class="name">${esc(m.name)}</div>
    <span class="tag" style="background:${T.tag}">${T.name} · ${T.p}%</span>
    <div class="stats"><span>체력<b>${m.hp}</b></span><span>공격<b>${m.atk}</b></span><span>방어<b>${m.def}</b></span></div>
    <div class="info">
      <label>상품 <input id="productInput" placeholder="상품 이름을 적어 주세요" value="${esc(m.product || '')}"></label>
      <div class="line"><span>잡은 때</span><span>${when(m.time)}</span></div>
      <label>장소 <input id="placeInput" placeholder="예: 집 앞 편의점" value="${esc(m.place || '')}"></label>
      <div class="line"><span>바코드</span><span>${m.code}</span></div>
    </div>`;
  const keep = (field, input) => input.onchange = () => { m[field] = input.value.trim(); save(STORE_KEY, catches); };
  keep('product', $('productInput'));
  keep('place', $('placeInput'));
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// 상품 이름 자동 검색 (Open Food Facts, 무료 공개 상품 정보). 못 찾으면 직접 적기
async function lookupProduct(m) {
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${m.code}.json?fields=product_name,product_name_ko,brands`);
    if (!r.ok) return;
    const j = await r.json(), p = j.product;
    const name = p && (p.product_name_ko || p.product_name);
    if (!name || m.product) return;
    m.product = (p.brands ? p.brands.split(',')[0].trim() + ' ' : '') + name;
    save(STORE_KEY, catches);
    const input = $('productInput');
    if (shown === m && input && !input.value) input.value = m.product; // 다른 몬스터 카드에 잘못 넣지 않게
  } catch { /* 인터넷 오류 등: 직접 적기 */ }
}

async function handleCode(raw) {
  const code = cleanCode(raw);
  if (!code) { $('msg').textContent = '상품 바코드(숫자 8~14자리)가 아니에요.'; return; }
  $('msg').textContent = '';
  try { await partsReady; } catch (e) { $('msg').textContent = e.message; return; }
  const day = today();
  const already = catches.find(c => c.code === code && c.day === day);
  if (already) { showCard(already, '오늘 이 상품에서는 이미 잡았어요. 내일 다시 와요!'); return; }
  const m = { ...makeMonster(code, day, player), time: new Date().toISOString(), product: '', place: '' };
  catches.unshift(m);
  save(STORE_KEY, catches);
  renderDex();
  showCard(m, m.tier >= 4 ? `🎉 ${TIERS[m.tier].name} 몬스터를 잡았어요!` : '새 몬스터를 잡았어요!');
  lookupProduct(m);
}

$('dex').onclick = e => {
  const cell = e.target.closest('.cell');
  if (cell) showCard(catches[+cell.dataset.i]);
};

// ================= 바코드 읽기 =================
let detector = null;
function getDetector() {
  if (!window.BarcodeDetectionAPI) { $('msg').textContent = '바코드 판독기를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return null; }
  return detector ??= new BarcodeDetectionAPI.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
}

// 실시간 카메라 스캔
let stream = null;
function stopScan() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('video').srcObject = null;
  $('video').hidden = true;
  $('scanBtn').textContent = '📷 바코드 스캔';
}
$('scanBtn').onclick = async () => {
  if (stream) return stopScan();
  const det = getDetector();
  if (!det) return;
  $('msg').textContent = '';
  let mine;
  try {
    // 고화질로 받아야 바코드의 가는 줄이 뭉개지지 않음
    mine = stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
    const v = $('video');
    v.srcObject = stream;
    v.hidden = false;
    await v.play();
  } catch {
    stopScan();
    $('msg').textContent = '카메라를 켤 수 없어요. 카메라 권한을 허용하거나 "사진으로 읽기"를 써 주세요.';
    return;
  }
  $('scanBtn').textContent = '■ 스캔 멈추기';
  const tick = async () => {
    if (stream !== mine) return; // 멈췄거나 새 스캔이 시작됨
    try {
      const [hit] = await det.detect($('video'));
      if (hit && stream === mine) { stopScan(); handleCode(hit.rawValue); return; }
    } catch { /* 영상 준비 전 등: 다음 장면에서 다시 시도 */ }
    setTimeout(tick, 150);
  };
  tick();
};

// 사진 속 바코드 읽기
$('photo').onchange = async () => {
  const file = $('photo').files[0];
  $('photo').value = ''; // 같은 사진을 다시 골라도 동작하게
  if (!file) return;
  stopScan();
  const det = getDetector();
  if (!det) return;
  $('photoLabel').textContent = '읽는 중…';
  $('msg').textContent = '';
  try {
    const [hit] = await det.detect(file);
    if (hit) handleCode(hit.rawValue);
    else $('msg').textContent = '사진에서 바코드를 찾지 못했어요. 바코드가 화면에 크고 선명하게 나오도록 다시 찍어 주세요.';
  } catch {
    $('msg').textContent = '사진을 읽지 못했어요. 다른 사진으로 해 주세요.';
  } finally {
    $('photoLabel').textContent = '🖼 사진으로 읽기';
  }
};

partsReady.then(renderDex, e => { $('msg').textContent = e.message; });

// 자체 점검: 주소 끝에 #test 를 붙이면 콘솔에 결과 출력
if (location.hash === '#test') {
  const a = makeMonster('8801234567890', '2026-11-27', 'p1');
  console.assert(JSON.stringify(a) === JSON.stringify(makeMonster('8801234567890', '2026-11-27', 'p1')), '같은 바코드·날짜·사람 → 같은 몬스터');
  console.assert(nameFor(a) === nameFor({ ...a, tier: 5 }), '모습이 같으면 이름도 같음');
  console.assert(cleanCode('abc') === null && cleanCode('8801234567890') === '8801234567890', '바코드 검사');
  const count = TIERS.map(() => 0);
  for (let i = 0; i < 100000; i++) count[makeMonster(String(8800000000000 + i), '2026-11-27', 'p1').tier]++;
  console.log('selftest 등급 분포(10만 회, %):', count.map(c => c / 1000));
  // 시험용으로 바코드 3개를 잡아 봄 (이 브라우저 기록에 저장됨)
  partsReady.then(async () => { for (const c of ['8801043014809', '8801062518210', '8801019606557']) await handleCode(c); await handleCode('8801043014809'); });
}
</script>
